  - { platform: greenhouse, token: conga, company: Conga }
  - { platform: greenhouse, token: dscout, company: Dscout }
  - { platform: greenhouse, token: lynxanalytics, company: Lynx Analytics }
  - { platform: greenhouse, token: capco, company: Capco }
  - { platform: greenhouse, token: gleanwork, company: Glean }
  - { platform: greenhouse, token: dialpad, company: Dialpad }
  - { platform: greenhouse, token: commvault, company: Commvault }
  - { platform: greenhouse, token: ensono, company: Ensono }
