  # Remote-job boards with free public APIs (terms: link back + name the board;
  # never re-publish). Token for Himalayas = "<keywords>|<country>", empty
  # country = worldwide-remote only. Remotive token = category, fetched once.
  - { platform: himalayas, token: "java|India", company: Himalayas }
  - { platform: himalayas, token: "backend|India", company: Himalayas }
  - { platform: himalayas, token: "ai engineer|India", company: Himalayas }
  - { platform: himalayas, token: "llm|India", company: Himalayas }
  - { platform: himalayas, token: "java|", company: Himalayas }
  - { platform: himalayas, token: "ai engineer|", company: Himalayas }
  - { platform: remotive, token: software-dev, company: Remotive }
  # Public Telegram channels (read through the t.me/s web preview; no login).
  # Each lead carries the channel's subscriber count / last-post date and a
  # link-safety verdict; posts with payment/"exam help" wording or unsafe
  # links are dropped. Checked 2026-09-17: subscribers in brackets.
  - { platform: telegram, token: offcampusjobsindia_IT, company: Off Campus Jobs India }  # 99.6K (Leela)
  - { platform: telegram, token: offcampusjobs_4u, company: Off Campus Jobs group }       # 66K members, GROUP: no public preview, reported as unreadable (Leela)
  - { platform: telegram, token: experiencedjobs, company: Experienced Job Posts }        # 672 - LOW trust label
  - { platform: telegram, token: offcampusjobs4u, company: OffCampusJobs4u }              # 67.3K
  - { platform: telegram, token: kickcharm, company: KickCharm }                          # 110K
  - { platform: telegram, token: gocareers, company: Go Careers }                         # 79.4K
  - { platform: telegram, token: dot_aware, company: DotAware }                           # 42.8K
  - { platform: telegram, token: jobs_and_internships_updates, company: Krishan Kumar Jobs }  # 198K
  - { platform: telegram, token: govtjobs9, company: All Government Jobs }                # 74.9K (govt)
  - { platform: telegram, token: governmentalerts, company: Government Jobs Alerts }       # 61.6K (govt)
  # Job blogs that publish schema.org JobPosting data and allow crawling
  # (robots.txt checked on every run). Their "apply on company website" link
  # becomes the Job URL.
  - { platform: jobsite, token: "https://www.offcampusjobsindia.com/category/it-jobs", company: offcampusjobsindia.com }  # Leela
  - { platform: jobsite, token: "https://www.offcampusjobsindia.com/remote-jobs", company: offcampusjobsindia.com }

# Target role families (title must match at least one).
include_titles:
  - software engineer
  - software developer
  - backend
  - back end
  - back-end
  - java
  - api engineer
  - ai engineer
  - genai
  - generative ai
  - llm
  - agentic
  - ml engineer
  - machine learning engineer
  - applied ai
  - ai application
  - ai platform
  - platform engineer
  - integration engineer
  - automation engineer
  - sde
  - member of technical staff

# Never relevant at 4.7 years / for this career direction.
exclude_titles:
  - principal
  - staff
  - director
  - head
  - vp
  - manager
  - architect
  - lead
  - intern
  - sales
  - account
  - recruiter
  - designer
  - frontend
  - front end
  - ios
  - android
  - qa
  - test engineer
  - testing
  - sdet
  - selenium
  - full stack
  - fullstack
  - data scientist
  - site reliability
  # gig / annotation work, not a permanent engineering role
  - tutor
  - task based
  - per task
  - freelance
  - trainer

# Work authorisation: roles outside these are skipped BEFORE scoring
# (remote-worldwide roles are always kept).
allowed_countries: [India, UAE, Qatar, Saudi Arabia]
# Location purpose (Leela, 2026-09-17). TARGET = would accept an offer.
# PRACTICE = apply only to practise interviews; offers there will be declined.
# Move a city between the lists when her plan changes.
target_locations:
  [hyderabad, secunderabad, bengaluru, bangalore, chennai,
   dubai, abu dhabi, sharjah, doha, riyadh, jeddah]
practice_locations:
  [pune, mumbai, navi mumbai, thane, gurgaon, gurugram, noida, greater noida,
   delhi, new delhi, delhi ncr, ncr, faridabad, ghaziabad, kolkata]

# Resume gate: a tailored resume is READY only when the validation gate passes
# AND the ESTIMATED ATS is at least min_ats. The laptop auto-submit rule also
# needs match >= auto_submit_min_match and a GENUINE company (SYSTEM_SPEC 11a).
min_ats: 90
auto_submit_min_match: 80
max_resumes_per_run: 10

# Hard switch for the SYSTEM_SPEC 11a auto-apply rule. While this is false no row is
# reported as clear to submit, whatever it scores.
# paused 2026-09-18 by Leela until the resume is finalised
auto_apply:
  enabled: false

# Non-secret Notion targets (ids are not credentials; the token stays a secret).
notion:
  report_page_id: 3debe82c-b558-8160-904f-caf9085ed447   # "Daily Reports"
  govt_data_source_id: 192bff6e-d861-435a-a90f-777f2571d0b5  # "Govt Job Tracker"

# Government IT jobs: official recruitment pages checked daily for NEW links
# that mention this or next year and a CS/IT signal (cs_org: every recruitment
# link counts). Bank posts are excluded. Unreachable pages are reported only.
max_govt_new_per_run: 25
