[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-career-agent"
version = "1.0.0"
description = "MCP-driven job analysis, match scoring and resume tailoring with a factual-validation gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Naga Leela Krishna Rajamahendravarapu" }]
dependencies = ["pydantic>=2.6", "pyyaml>=6.0", "typer>=0.12", "rich>=13.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10", "bandit>=1.7"]

[project.scripts]
career-agent = "career_agent.cli:app"
career-agent-mcp = "career_agent.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"src/career_agent/cli.py" = ["B008"]
