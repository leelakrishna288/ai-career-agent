name: Daily job discovery

# Runs in GitHub's cloud, so it works while the laptop is off.
# 23:45 UTC = 05:15 IST, before the Claude daily run at 06:00 IST picks up
# the new rows for company checks and resume tailoring.
on:
  schedule:
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Check configuration
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$NOTION_DATA_SOURCE_ID" ]; then
            echo "::error::Set the NOTION_TOKEN secret and the NOTION_DATA_SOURCE_ID variable (see docs/STANDALONE_RUNTIME.md)"
            exit 1
          fi
      - name: Discover, score and record
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
          NOTION_REPORT_PAGE_ID: ${{ vars.NOTION_REPORT_PAGE_ID }}
        # The repository is public, so only the counts-only summary goes to the
        # job log. Company names, roles and scores stay in Notion.
        run: |
          career-agent discover --notion --report-dir /tmp/reports \
            --public-summary /tmp/public_summary.md > /tmp/run.log 2>&1 || status=$?
          cat /tmp/public_summary.md >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "^(INFO|WARNING|ERROR)" /tmp/run.log | sed -E 's#(https?://)[^ ]+#\1<redacted>#g' || true
          exit ${status:-0}
