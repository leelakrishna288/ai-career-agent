projects:
- name: mutagent - AI-Assisted Mutation Testing for Java
  url: https://github.com/leelakrishna288/mutagent
  stack: Java 21 · Mutation Testing · LLM-Assisted Test Generation · MCP · GitHub Actions CI · zero third-party dependencies
  label: VERIFIED
  shipped: true
  bullets:
  - Built a Java 21 mutation-testing system that injects controlled defects into source code to expose weaknesses in existing test suites - six mutation operator families, in-memory compilation on the JDK Compiler API, an isolated class loader per mutant, and survivor detection.
  - Added an LLM-assisted loop that proposes candidate tests for surviving mutants, where deterministic checks decide acceptance - a static policy engine, compilation, a pass against unmutated code, and a mutation re-run.
  - Demonstrated mutation score 20% -> 90% on the project fixture by scoring several candidates per round against a deterministic evaluation function and accepting only tests that killed previously surviving mutants.
  - Cut per-mutant cost with a SHA-256 fingerprinted incremental compilation cache and coverage-guided execution that runs only the tests reaching the mutated method; proved the optimisation safe with an A/B against exhaustive execution.
  - Exposed the tool through both a CLI and a hand-written MCP server (JSON-RPC 2.0 over stdio, no SDK), supporting developer workflows and AI/tool-driven integration.
  - Added mutation risk scoring and an offline replay model so the evaluation logic is testable with no API key or network; 83 self-tests, green GitHub Actions CI, zero third-party dependencies.
- name: mirage - RAG Grounding & Evidence-Sensitivity Evaluation Framework
  url: ''
  stack: Python · RAG · BM25 + Dense Retrieval · Embeddings · Vector Search · LLM Evaluation · CI Test Gates
  label: VERIFIED
  shipped: false
  bullets:
  - Built a GenAI evaluation framework that verifies whether RAG answers genuinely depend on retrieved evidence rather than producing plausible text and citations.
  - Implemented the retrieval stack - sentence-aware chunking, embeddings with a content-hash cache, cosine similarity over an in-memory vector index, and hybrid BM25 + dense retrieval fused by reciprocal rank fusion.
  - Designed controlled evidence-perturbation operators - evidence deletion, fact corruption, entity swap, contradiction injection and distractor injection - with evidence-set resolution so a fact repeated across documents does not produce a false result.
  - Added repeated baselines, paraphrase controls and irrelevant-corruption controls with variance calibration, separating genuine grounding failures from normal LLM response variance.
  - Demonstrated 60% grounded evidence sensitivity against 30% in an ungrounded configuration on the documented fixture, with a per-operator breakdown that distinguishes retrieval problems from prompt problems.
  - Implemented corpus snapshot/restore, CLI scans, HTML reporting and a CI test gate; 28 tests, CI on Python 3.10-3.12.
