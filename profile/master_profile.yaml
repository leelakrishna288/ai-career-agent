projects:
- name: Muraqib - Agentic AI Governance & Compliance Assessment Platform
  url: https://github.com/leelakrishna288/muraqib
  stack: Python, FastAPI, MCP, RAG (BM25 + dense), Chroma/pgvector, Pydantic, OAuth2.1/OIDC, Docker, GitHub Actions, pytest
  label: VERIFIED
  shipped: false
  bullets:
  - Built an end-to-end agentic system assessing an AI platform against 121 controls across eight governance instruments,
    producing coverage, a deterministic risk tier and a de-duplicated remediation plan.
  - Designed a six-node orchestrator as an explicit state graph with checkpointing and resume; only two of six nodes call
    a model, keeping the rest deterministic and auditable.
  - Implemented an MCP server (JSON-RPC 2.0 over stdio, six tools) so any MCP client can drive an assessment.
  - Built hybrid BM25 + dense retrieval with a labelled recall benchmark enforced in CI.
  - Engineered four layers of prompt-injection defence and a citation gate that makes hallucination lower the score rather
    than hide in it.
  - Built a five-metric evaluation harness gating CI; its first run exposed three real defects, fixed rather than threshold-lowered.
  - Implemented a hash-chained append-only audit ledger with a verification command.
  - Secured the service with OAuth 2.1 / OIDC JWKS verification and role inheritance; provider-agnostic across six LLM providers
    with hard per-run call and cost ceilings.
  - Shipped with 140 tests at 86% coverage, ruff / mypy / bandit / pip-audit clean, a non-root hardened container and GitHub
    Actions CI across Python 3.10 to 3.12.
  - Evaluation harness first run scored 70% status accuracy with a 16.7% over-claim rate and exposed three engine defects;
    after fixing them accuracy reached 100% and over-claim rate 0%.
  - Corpus covers 121 controls across 8 governance instruments including ISO/IEC 42001 and NIST AI 100-1.
- name: AI Career Agent - MCP-driven job analysis and resume tailoring
  url: https://github.com/leelakrishna288/ai-career-agent
  stack: Python, MCP, Pydantic, pytest, GitHub Actions
  label: VERIFIED
  shipped: false
  bullets:
  - Built an MCP server exposing deterministic tools - a weighted job-match scoring rubric with hard-reject rules, an ATS-oriented
    resume generator behind a factual-validation gate, and an append-safe application tracker.
  - Enforced a validation gate that blocks any generated resume containing a claim not present in the master profile, so tailoring
    can never introduce a fabricated skill, employer, metric or certification.
  - 74 tests at 96% coverage, ruff and bandit clean, CI on Python 3.10 to 3.12; a seven-check validation gate with 100% of
    blocking checks covered by tests.
